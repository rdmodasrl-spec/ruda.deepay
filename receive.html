<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f7" />
    <meta name="description" content="DEEPAY 钱包收款页面原型。" />
    <title>收款 - DEEPAY Wallet</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/wallet.css?v=3" />
    <style>
      .receive-shell { max-width:820px; }
      .page-header { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:22px; }
      .page-header h1 { margin:0; font-size:26px; font-weight:600; }
      .page-header p { margin:8px 0 0; color:var(--wallet-muted); font-size:14px; }
      .receive-grid { display:grid; grid-template-columns:0.85fr 1.15fr; gap:16px; }
      .receive-card, .details-card { padding:22px; }
      .qr-placeholder { display:grid; min-height:220px; place-items:center; border:1px dashed var(--wallet-border); border-radius:14px; background:var(--wallet-subtle); color:var(--wallet-muted); text-align:center; }
      .qr-placeholder strong { display:block; margin-bottom:8px; color:var(--wallet-text); font-weight:600; }
      .asset-select { width:100%; padding:0 12px; }
      .details-card h2 { margin:0 0 14px; font-size:16px; font-weight:600; }
      .detail-row { padding:12px 0; border-top:1px solid var(--wallet-border); }
      .detail-row strong { display:block; margin-bottom:5px; font-size:14px; font-weight:500; }
      .detail-row span { color:var(--wallet-muted); font-size:13px; line-height:1.5; overflow-wrap:anywhere; }
      .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
      @media(max-width:700px) {
        .receive-grid { grid-template-columns:1fr; }
        .receive-card, .details-card { padding:16px; }
        .page-header h1 { font-size:22px; }
        .qr-placeholder { min-height:180px; }
      }
    </style>
  </head>
  <body>
    <div class="shell receive-shell">
      <header class="topbar">
        <div class="brand">
          <img src="/logo.png" width="34" height="34" alt="DEEPAY" />
          <span>DEEPAY</span>
        </div>
        <span class="wallet-status">收款地址 API 未连接</span>
      </header>
      <main class="content">
        <div class="page-header">
          <div>
            <h1>收款</h1>
            <p>展示用于 TEST 环境内部转账的钱包 ID，不是链上充值地址。</p>
          </div>
          <a class="action-btn" href="/">返回首页</a>
        </div>
        <div class="receive-grid">
          <section class="panel receive-card">
            <div class="field">
              <label for="asset">资产 / 网络</label>
              <select id="asset" class="asset-select" disabled>
                <option>等待资产与网络配置服务</option>
              </select>
            </div>
            <div class="qr-placeholder" role="status">
              <div>
                <strong>链上二维码未开放</strong>
                内部转账请复制钱包 ID
              </div>
            </div>
            <div class="actions">
              <button class="action-btn" type="button" data-wallet-action="copy-address" disabled>复制钱包 ID</button>
              <a class="action-btn" href="/wallet-transactions.html">交易记录</a>
            </div>
          </section>
          <aside class="panel details-card">
            <h2>收款信息</h2>
            <div class="detail-row">
              <strong>内部收款钱包 ID</strong>
              <span data-wallet-id>请登录后查看。</span>
            </div>
            <div class="detail-row">
              <strong>网络</strong>
              <span>目前只用于 DEEPAY TEST 环境内部转账，不是链上地址。</span>
            </div>
            <div class="detail-row">
              <strong>到账状态</strong>
              <span>内部转账会记录在双方的测试账本中；链上收款尚未启用。</span>
            </div>
          </aside>
        </div>
      </main>
    </div>
    <script src="/wallet.js?v=3" defer></script>
  </body>
</html>
